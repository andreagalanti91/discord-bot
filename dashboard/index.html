<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chento Tracker</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 17l5-6 4 3 6-8 3 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>Chento Tracker</span>
    </div>
    <nav class="segmented" role="tablist" id="tabs">
      <button role="tab" data-tab="overview" aria-selected="true">Panoramica</button>
      <button role="tab" data-tab="strategy">Strategia</button>
      <button role="tab" data-tab="feed">Messaggi</button>
      <button role="tab" data-tab="compare">Confronto</button>
      <button role="tab" data-tab="alerts">Alert</button>
    </nav>
    <div class="nav-meta" id="meta"></div>
  </div>
</header>

<div id="banner"></div>

<main>
  <section id="overview" class="tab active"></section>
  <section id="strategy" class="tab"></section>
  <section id="feed" class="tab"></section>
  <section id="compare" class="tab"></section>
  <section id="alerts" class="tab"></section>
</main>

<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<div class="tooltip" id="tooltip" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
